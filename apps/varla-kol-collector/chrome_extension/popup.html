<!doctype html>
<meta charset="utf-8">
<style>

    font-family: Arial, "Microsoft YaHei", sans-serif;
    color: #1f2329;

  }
  h1 {
    font-size: 18px;
    margin: 0 0 10px;
  }
  .status {
    padding: 8px;
    border-radius: 6px;
    margin: 8px 0;

  }
  .ok {

    border: 1px solid #b7ebc6;
  }
  .bad {
    background: #fff1f0;

  }
  button {
    width: 100%;
    border: 0;
    border-radius: 6px;
    padding: 9px 12px;
    background: #245bdb;
    color: white;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  button.secondary {
    background: #43546f;
  }
  .small {
    color: #646a73;
    font-size: 12px;

  }
